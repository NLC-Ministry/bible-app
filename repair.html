<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04A9D2">
  <title>&#30059;&#38754;&#20462;&#24489;</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 24px; background: #fafafa; color: #171717; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; text-align: center; }
    main { width: min(380px, 100%); }
    h1 { margin: 0 0 14px; font-size: 24px; }
    p { margin: 0 0 24px; color: #555; font-size: 16px; line-height: 1.7; }
    button { border: 0; border-radius: 12px; background: #04A9D2; color: #fff; padding: 12px 22px; font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1 id="repair-title">&#27491;&#22312;&#20462;&#24489;&#30059;&#38754;</h1>
    <p id="repair-status" role="status">&#27491;&#22312;&#28165;&#38500;&#33290;&#29256;&#30059;&#38754;&#36039;&#28304;&#65292;&#19981;&#26371;&#21034;&#38500;&#20320;&#30340;&#30331;&#20837;&#36039;&#26009;&#25110;&#35712;&#32147;&#36914;&#24230;&#12290;</p>
    <button id="repair-retry" type="button" hidden>&#20877;&#35430;&#19968;&#27425;</button>
  </main>
  <script>
    (function () {
      const status = document.getElementById("repair-status");
      const retry = document.getElementById("repair-retry");

      async function repair() {
        retry.hidden = true;
        status.textContent = "\u6b63\u5728\u6e05\u9664\u820a\u7248\u756b\u9762\u8cc7\u6e90\uff0c\u4e0d\u6703\u522a\u9664\u4f60\u7684\u767b\u5165\u8cc7\u6599\u6216\u8b80\u7d93\u9032\u5ea6\u3002";
        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(registration => registration.unregister()));
          }
          if (window.caches) {
            const names = await caches.keys();
            await Promise.all(names
              .filter(name => name.startsWith("newlife-bible-") || name.startsWith("church-bible-"))
              .map(name => caches.delete(name)));
          }
          const stylesheetResponse = await fetch("/index.css?version=" + Date.now(), { cache: "no-store" });
          const stylesheetType = stylesheetResponse.headers.get("content-type") || "";
          if (!stylesheetResponse.ok || !stylesheetType.toLowerCase().includes("text/css")) {
            throw new Error("The repaired stylesheet is not available yet.");
          }
          sessionStorage.setItem("nlc_asset_repair_completed_at", String(Date.now()));
          window.setTimeout(function () {
            window.location.replace("/?repaired=1&version=" + Date.now());
          }, 350);
        } catch (error) {
          status.textContent = "\u4fee\u5fa9\u5c1a\u672a\u5b8c\u6210\uff0c\u8acb\u78ba\u8a8d\u7db2\u8def\u5f8c\u518d\u8a66\u4e00\u6b21\u3002";
          retry.hidden = false;
        }
      }

      retry.addEventListener("click", repair);
      repair();
    })();
  </script>
</body>
</html>
