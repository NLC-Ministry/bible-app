name: Release gate

# 上線審核（見 docs/staging.md「上線到正式環境」）：
# 在 staging 網站確認沒問題後「按 merge」就代表確認上線。這個檢查確保上線 PR：
#   1. 從 staging（或緊急修正用的 hotfix/*）開出來
#   2. 已經包含 main 上所有有內容的 commit（緊急修正要先併回 staging）
# ci.yml 的 deploy job 也會再檢查一次：只有從這些分支 merge 進來的才部署到正式環境。

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  release-gate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check release rules
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          report() { echo "$1"; echo "- $1" >> "$GITHUB_STEP_SUMMARY"; }
          echo "## 上線審核" >> "$GITHUB_STEP_SUMMARY"

          case "$HEAD_REF" in
            staging|hotfix/*) report "✅ 來源分支：$HEAD_REF" ;;
            *) report "❌ 來源分支是 $HEAD_REF。上線 PR 只能從 staging（或緊急修正用的 hotfix/*）開"; fail=1 ;;
          esac

          git fetch -q origin main
          missing=$(git rev-list --no-merges "$HEAD_SHA..origin/main" | wc -l)
          if [ "$missing" -eq 0 ]; then
            report "✅ 已包含 main 上所有的修改"
          else
            report "❌ main 上有 $missing 個修改還沒併進來（通常是緊急修正）。請先在 staging 執行 git merge origin/main 再 push"
            fail=1
          fi

          if [ "$fail" -eq 0 ]; then
            report "👉 在 staging 網站照 PR 裡的清單確認沒問題後，按 merge 就會上線"
          fi

          exit $fail
